server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: front-gateway
  profiles:
    default: mock
  mvc:
    async:
      request-timeout: 600000
  task:
    scheduling:
      pool:
        size: 4

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [${llm.front-gateway.instance-id}] [%X{requestId:-}] %logger{0} - %msg%n"

llm:
  http:
    connect-timeout-ms: 500
    read-timeout-ms: 5000
  front-gateway:
    instance-id: ${INSTANCE_ID:front-gateway}
    broker-urls: ${BROKER_URLS:http://localhost:8081,http://localhost:8082}
    model-manager-url: ${MODEL_MANAGER_URL:http://localhost:8110}
    position-poll-interval-ms: 1000
    ratio-poll-interval-ms: 1000
    sse-timeout-ms: 600000
    chars-per-token: 4
    # 한글·한자·가나는 1글자를 이만큼의 토큰으로 센다 (글자 수 ÷ 4로 세면 한글 입력이 3~4배 적게 잡힌다, R4)
    wide-char-tokens: 1.0
    default-version: v1
    cors-origins: ${CORS_ORIGINS:http://localhost:8140}
    broker-retry-budget-ms: 20000
    broker-retry-backoff-ms: 300
