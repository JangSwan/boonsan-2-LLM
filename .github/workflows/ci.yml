name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드와 테스트
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - name: 앱 jar 보관
        uses: actions/upload-artifact@v4
        with:
          name: app-jars
          path: '*/build/libs/*.jar'

  # 시나리오(sd1~sd6)는 docker compose 환경에서 통합 테스트로 확인한다 (CLAUDE.md 8절).
  scenarios:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-jars

      - name: docker compose up
        run: docker compose up -d --build --wait --wait-timeout 420

      - name: sd1 ~ sd6 통합 시나리오
        run: MODE=compose scripts/scenarios/run-all.sh

      - name: 실패 시 로그
        if: failure()
        run: docker compose logs --no-color --tail=400

      - name: 정리
        if: always()
        run: docker compose down -v
